<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Reversal Probability Zones 5m + 15m</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html{height:100%}
  body{display:flex;flex-direction:column}
  html,body{margin:0;height:100%;background:#131722;color:#d1d4dc;font:13px system-ui,sans-serif}
  #bar{display:flex;gap:12px;align-items:center;padding:8px 12px;flex-wrap:wrap;background:#1e222d}
  input,select,button{background:#2a2e39;color:#d1d4dc;border:1px solid #434651;border-radius:4px;padding:3px 6px}
  input[type=number]{width:64px}
  .wrap{position:relative;flex:1 1 0;min-height:0;overflow:hidden;box-shadow:inset 0 1px 0 #2a2e39}
  .wrap > .c,.wrap > canvas{position:absolute;inset:0;width:100%;height:100%}
  .wrap > canvas{pointer-events:none;z-index:5}
  .tag{position:absolute;left:10px;top:8px;z-index:6;background:rgba(42,46,57,.85);padding:2px 8px;border-radius:4px;font-weight:600;pointer-events:none;white-space:pre}
  .tag .info{font-weight:400}
</style>
</head>
<body>
<div id="bar">
  <label>Simbolo <input id="sym" value="QQQ" size="7"></label>
  <label>Twelve Data key <input id="key" type="text" size="30" autocomplete="off" spellcheck="false" placeholder="incolla qui la chiave"></label>
  <label>Swing Length <input id="len" type="number" value="20" min="2"></label>
  <label>Max Reversals <input id="maxp" type="number" value="1000" min="5"></label>
  <label><input id="norm" type="checkbox"> Normalize</label>
  <label><input id="nov" type="checkbox" checked> No Overlap</label>
  <label><input id="last" type="checkbox"> Solo ultima zona</label>
  <label><input id="marks" type="checkbox" checked> Marks</label>
  <button id="go">Carica</button>
  <span id="st"></span>
</div>
<div class="wrap" id="w5"></div>
<div class="wrap" id="w15"></div>

<script>
  window.addEventListener('error', e => { if (/ResizeObserver/.test(e.message)) return; const el = document.getElementById('st'); if (el) el.textContent = 'ERRORE JS: ' + e.message; });
</script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"
        onerror="document.getElementById('st').textContent='ERRORE: libreria grafici non caricata (rete/adblock?)'"></script>
<script>
// ───────────── Motore: port 1:1 della logica Pine ─────────────
const HIGH = 1, LOW = -1;
const PCTS = [
  { p: 25, dash: [2, 3], on: true },
  { p: 50, dash: [6, 4], on: true },
  { p: 75, dash: [6, 4], on: true },
  { p: 90, dash: [],     on: true },
];

// percentile_nearest_rank di Pine
const rank = (arr, p) => arr[Math.max(0, Math.min(arr.length - 1, Math.ceil(p / 100 * arr.length) - 1))];

function compute(bars, o) {
  const n = bars.length, L = o.length;
  const bull = { prices: [], bars: [] }, bear = { prices: [], bars: [] };
  let zones = [], marks = [];
  let bias = null;
  let curPrice = bars[0].close, curBar = 0;      // currentPrice / currentBar di fetchPivot
  let lastPrice = bars[0].close, lastBar = 0;    // lastPrice / lastBar di fetchData
  const maxPct = Math.max(...PCTS.filter(x => x.on).map(x => x.p), 0);

  for (let i = L - 1; i < n; i++) {              // ta.highest/lowest = na prima di L barre
    const b = bars[i];
    const mx = Math.max(b.open, b.close), mn = Math.min(b.open, b.close);
    let up = -Infinity, lo = Infinity;
    for (let j = i - L + 1; j <= i; j++) {
      const bj = bars[j];
      up = Math.max(up, Math.max(bj.open, bj.close));
      lo = Math.min(lo, Math.min(bj.open, bj.close));
    }

    // ── fetchPivot ──
    const prevBias = bias;
    bias = mx === up ? HIGH : mn === lo ? LOW : bias;
    let newPivot = false, pPrice, pBar, pBias;
    if (prevBias !== null && bias !== prevBias) {
      newPivot = true;
      pPrice = curPrice; pBar = curBar;
      pBias = bias === LOW ? HIGH : LOW;
      curPrice = bias === HIGH ? up : lo;
      curBar = i;
    } else {
      const np = bias === HIGH ? Math.max(up, curPrice) : Math.min(lo, curPrice);
      if (np !== curPrice) curBar = i;
      curPrice = np;
    }
    if (!newPivot) continue;

    // ── fetchData ──
    const bullish = pPrice > lastPrice;
    const pd = Math.abs(pPrice - lastPrice) / (o.normalize ? lastPrice : 1);
    const bd = pBar - lastBar;
    const P = bullish ? bull : bear;
    if (bd !== 0) {
      P.prices.push(pd); P.bars.push(bd);
      lastPrice = pPrice; lastBar = pBar;
      if (P.prices.length > o.maxPivots) { P.prices.shift(); P.bars.shift(); }
    }

    // ── plotMarks ──
    if (o.marks) marks.push({ bar: pBar, price: pPrice, high: pBias === HIGH });

    // ── plotForecast ──
    const pivotHigh = pBias === HIGH;
    const Q = pivotHigh ? bear : bull;
    if (!Q.prices.length) continue;
    // come in Pine, sort() ordina gli array in place
    Q.prices.sort((a, b) => a - b);
    Q.bars.sort((a, b) => a - b);
    const maxP = rank(Q.prices, maxPct), maxB = rank(Q.bars, maxPct);
    const dir = pivotHigh ? -1 : 1;
    const dy = v => dir * (o.normalize ? pPrice * v : v);

    if (o.noOverlap && !o.onlyLast && zones.length) {
      const z = zones[zones.length - 1];
      if (z.x1 > pBar) z.x1 = pBar;
      z.labels = z.labels.filter(l => l.x <= pBar);
      z.lines = z.lines.filter(l => l.x2 <= pBar);
    }
    const z = { x0: pBar, x1: pBar + maxB, y0: pPrice, y1: pPrice + dy(maxP), pivotHigh, lines: [], labels: [] };
    for (const c of PCTS.filter(x => x.on)) {
      const pp = rank(Q.prices, c.p), bp = rank(Q.bars, c.p);
      const yH = pPrice + dy(pp);
      const tag = c.p + 'th';
      z.lines.push({ x1: pBar, x2: pBar + maxB, y1: yH, y2: yH, dash: c.dash });
      z.lines.push({ x1: pBar + bp, x2: pBar + bp, y1: pPrice, y2: pPrice + dy(maxP), dash: c.dash });
      z.labels.push({ x: pBar + maxB, y: yH, t: tag, side: 'left' });
      z.labels.push({ x: pBar + bp, y: pPrice, t: tag, side: pivotHigh ? 'down' : 'up' });
    }
    // le linee verticali hanno x1 = x2: uniforma per il filtro no-overlap
    z.lines.forEach(l => l.x2 = Math.max(l.x1, l.x2));
    if (o.onlyLast) zones = [z]; else zones.push(z);
  }
  return { zones, marks };
}

// ───────────── Dati: Twelve Data (azioni/ETF USA, serve API key) ─────────────
const $ = id => document.getElementById(id);
const TD = 'https://api.twelvedata.com/time_series';
async function td(sym, size, interval, dur) {
  const r = await fetch(`${TD}?symbol=${encodeURIComponent(sym)}&interval=${interval}&outputsize=${size}&order=asc&timezone=UTC&apikey=${$('key').value.trim()}`);
  const j = await r.json();
  if (j.status === 'error' || !j.values) throw new Error(j.message || 'risposta vuota');
  const now = Date.now() / 1000;
  return j.values
    .map(v => ({ time: Date.parse(v.datetime.replace(' ', 'T') + 'Z') / 1000, open: +v.open, high: +v.high, low: +v.low, close: +v.close }))
    .filter(b => b.time + dur <= now);               // solo candele chiuse
}

// Twelve Data non offre il 3min: lo costruiamo aggregando i dati a 1 minuto
function aggregate(raw, n) {
  const sec = 60 * n, out = [];
  let cur = null;
  for (const b of raw) {
    const t = Math.floor(b.time / sec) * sec;
    if (!cur || cur.time !== t) {
      if (cur) out.push(cur);
      cur = { time: t, open: b.open, high: b.high, low: b.low, close: b.close, end: b.time };
    } else {
      cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low);
      cur.close = b.close; cur.end = b.time;
    }
  }
  if (cur) out.push(cur);
  const last = out[out.length - 1];
  if (last && last.end + 60 < last.time + sec) out.pop();      // scarta il gruppo ancora incompleto
  return out.map(({ time, open, high, low, close }) => ({ time, open, high, low, close }));
}

// ───────────── Formattazione ora locale ─────────────
const pad = n => String(n).padStart(2, '0');
const fmtT  = t => { const d = new Date(t * 1000); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtD  = t => { const d = new Date(t * 1000); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const fmtDT = t => fmtD(t) + ' ' + fmtT(t);

function opts() {
  return { length: +$('len').value, maxPivots: +$('maxp').value, normalize: $('norm').checked,
           noOverlap: $('nov').checked, onlyLast: $('last').checked, marks: $('marks').checked };
}

// ───────────── Pannello: grafico + overlay + dati + polling ─────────────
const statuses = {};
function showStatus() { $('st').textContent = Object.values(statuses).join('  |  '); }

function makePanel({ host, label, interval, dur, pollMs, getSize, agg }) {
  host.innerHTML = '<div class="c"></div><canvas></canvas><div class="tag">' + label + '<span class="info"></span></div>';
  const chart = LightweightCharts.createChart(host.querySelector('.c'), {
    autoSize: true,
    layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    localization: { timeFormatter: t => fmtDT(t) },
    timeScale: { timeVisible: true, rightOffset: 60, secondsVisible: false,
      tickMarkFormatter: (t, type) => type <= 2 ? fmtD(t) : fmtT(t) },
    rightPriceScale: { borderColor: '#434651' },
  });
  const series = chart.addCandlestickSeries({
    upColor: '#089981', downColor: '#F23645', wickUpColor: '#089981', wickDownColor: '#F23645', borderVisible: false,
  });
  const cv = host.querySelector(':scope > canvas'), ctx = cv.getContext('2d');   // il NOSTRO canvas, non quelli interni al grafico
  let raw = [], bars = [], res = { zones: [], marks: [] }, timer = null;

  const info = host.querySelector('.info');
  const f2 = v => v.toFixed(2);
  const showBar = b => { info.textContent = b ? '  ' + fmtDT(b.time) + '   O ' + f2(b.open) + '  H ' + f2(b.high) + '  L ' + f2(b.low) + '  C ' + f2(b.close) : ''; };
  chart.subscribeCrosshairMove(param => {
    const b = param && param.time ? param.seriesData.get(series) : null;
    showBar(b || bars[bars.length - 1]);
  });

  function fit() {
    const w = host.clientWidth, h = host.clientHeight, d = devicePixelRatio || 1;
    if (!w || !h) return;
    cv.width = w * d; cv.height = h * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  let fitQueued = false;
  new ResizeObserver(() => {
    if (fitQueued) return; fitQueued = true;
    requestAnimationFrame(() => { fitQueued = false; fit(); });
  }).observe(host);

  function draw() {
    requestAnimationFrame(draw);
    try { drawInner(); } catch (e) { statuses[label] = label + ' ERRORE draw: ' + e.message; showStatus(); }
  }
  function drawInner() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const ts = chart.timeScale(), vr = ts.getVisibleLogicalRange();
    if (!vr) return;
    const X = i => ts.logicalToCoordinate(i), Y = p => series.priceToCoordinate(p);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, ts.width(), h - ts.height()); ctx.clip();
    ctx.font = '12px system-ui'; ctx.textBaseline = 'middle';
    for (const z of res.zones) {
      if (z.x1 < vr.from || z.x0 > vr.to) continue;
      const col = z.pivotHigh ? '242,54,69' : '8,153,129';
      const x0 = X(z.x0), x1 = X(z.x1), y0 = Y(z.y0), y1 = Y(z.y1);
      if ([x0, x1, y0, y1].some(v => v == null)) continue;
      ctx.fillStyle = `rgba(${col},.18)`;
      ctx.fillRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
      ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(${col},.9)`; ctx.fillStyle = `rgba(${col},.9)`;
      for (const l of z.lines) {
        const a = X(l.x1), b = X(l.x2), c = Y(l.y1), d = Y(l.y2);
        if ([a, b, c, d].some(v => v == null)) continue;
        ctx.setLineDash(l.dash); ctx.beginPath(); ctx.moveTo(a, c); ctx.lineTo(b, d); ctx.stroke();
      }
      ctx.setLineDash([]);
      for (const t of z.labels) {
        const x = X(t.x), y = Y(t.y); if (x == null || y == null) continue;
        ctx.textAlign = t.side === 'left' ? 'left' : 'center';
        const dy = t.side === 'down' ? -9 : t.side === 'up' ? 9 : 0;
        ctx.fillText(t.t, x + (t.side === 'left' ? 4 : 0), y + dy);
      }
    }
    ctx.fillStyle = 'rgba(209,212,220,.5)'; ctx.textAlign = 'center';
    for (const m of res.marks) {
      if (m.bar < vr.from || m.bar > vr.to) continue;
      const x = X(m.bar), y = Y(m.price); if (x == null || y == null) continue;
      ctx.fillText('•', x, y + (m.high ? -8 : 8));
    }
    ctx.restore();
  }

  function recalc() {
    if (bars.length > +$('len').value) res = compute(bars, opts());
    statuses[label] = `${label}: ${bars.length} barre · ${res.zones.length} zone`;
    showStatus();
  }

  async function load(sym) {
    statuses[label] = label + ': carico…'; showStatus();
    try {
      raw = await td(sym, getSize(), interval, dur);
      bars = agg ? aggregate(raw, agg) : raw;
      series.setData(bars);
      showBar(bars[bars.length - 1]);
      recalc();
      chart.timeScale().scrollToRealTime();
      clearInterval(timer);
      timer = setInterval(async () => {
        try {
          const fresh = await td(sym, agg ? 10 : 5, interval, dur);
          let incoming = fresh;
          if (agg) {
            const lastRaw = raw.length ? raw[raw.length - 1].time : 0;
            fresh.filter(b => b.time > lastRaw).forEach(b => raw.push(b));
            incoming = aggregate(raw, agg);
          }
          const lastT = bars.length ? bars[bars.length - 1].time : 0;
          const add = incoming.filter(b => b.time > lastT);
          if (!add.length) return;
          add.forEach(b => { bars.push(b); series.update(b); });
          recalc();
        } catch (e) { statuses[label] = label + ' poll: ' + e.message; showStatus(); }
      }, pollMs);
    } catch (err) { statuses[label] = label + ' errore: ' + err.message; showStatus(); }
  }
  fit(); draw();
  return { load, recalc };
}

const p5  = makePanel({ host: $('w5'),  label: '5m',  interval: '5min',  dur: 300, pollMs: 120000, getSize: () => 5000 });
const p15 = makePanel({ host: $('w15'), label: '15m', interval: '15min', dur: 900, pollMs: 300000, getSize: () => 5000 });

function loadAll() {
  const sym = $('sym').value.trim().toUpperCase();
  p5.load(sym); p15.load(sym);
}
['len', 'maxp', 'norm', 'nov', 'last', 'marks'].forEach(id => $(id).addEventListener('change', () => { p5.recalc(); p15.recalc(); }));
$('go').onclick = loadAll;
try { $('key').value = localStorage.getItem('tdkey') || ''; } catch (e) {}
$('key').addEventListener('input', () => { try { localStorage.setItem('tdkey', $('key').value.trim()); } catch (e) {} });
if ($('key').value.trim()) loadAll(); else $('st').textContent = 'Incolla la chiave Twelve Data e clicca Carica';
</script>
</body>
</html>
